spring.application.name=alerts-service
server.port=0

##DB config properties
spring.datasource.url=jdbc:postgresql://localhost:5432/alert_service_db
spring.datasource.username=postgres
spring.datasource.password=test2323
spring.jpa.hibernate.ddl-auto=create-drop

##Eureka setup
eureka.client.serviceUrl.defaultZone=http://eureka:password@localhost:8761/eureka

##zipkin config
spring.zipkin.base-url=http://localhost:9411
spring.sleuth.sampler.probability=1.0

##kafka config
spring.kafka.bootstrap-servers=localhost:9092

##kafka PRODUCER config (create/send Maintenance Record events)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

##JSON type mapping for event objects (PRODUCER)
spring.kafka.producer.properties.spring.json.type.mapping=event:com.microservicesfinal.dto.requests.CreateMaintenanceHistoryRequest 


##kafka CONSUMER config (listen for alert events from broker)
spring.kafka.consumer.group-id=createAlertEventId
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer


##JSON type mapping for event objects (CONSUMER)
spring.kafka.consumer.properties.spring.json.type.mapping=event:com.microservicesfinal.dto.requests.CreateAlertRequest

