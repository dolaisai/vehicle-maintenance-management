spring.application.name=maintenance-service
server.port=0

##DB CONFIG PROPERTIES
spring.datasource.url=jdbc:postgresql://localhost:5432/maintenance_service_db
spring.datasource.username=postgres
spring.datasource.password=test2323
spring.jpa.hibernate.ddl-auto=create-drop

##SHOW SQL QUERIES IN LOGS
spring.jpa.show-sql=true

##SEED DATA CONFIG
    #wait until tables are created before trying to add data.
spring.jpa.defer-datasource-initialization=true
    ##enable running slq initialization scripts
spring.sql.init.mode=always

##Eureka setup
eureka.client.serviceUrl.defaultZone=http://eureka:password@localhost:8761/eureka

##zipkin config
spring.zipkin.base-url=http://localhost:9411
spring.sleuth.sampler.probability=1.0

#kafka config
spring.kafka.bootstrap-servers=localhost:9092

#kafka CONSUMER config (listen for alert events from broker)
spring.kafka.consumer.group-id=createHistoryEventId
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer


#JSON type mapping for event objects (CONSUMER)
spring.kafka.consumer.properties.spring.json.type.mapping=event:com.microservicesfinal.dto.requests.CreateMaintenanceHistoryRequest

##prometheus config (add actuator/prometheus endpoint)
management.endpoints.web.exposure.include=prometheus


