global:
  scrape_interval:     10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'alerts-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['alerts-service:8080']
        labels:
          application: 'Alerts Service Application'

  - job_name: 'maintenance-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['maintenance-service:8080']
        labels:
          application: 'Maintenance Service Application'

  - job_name: 'rule-evaluation-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['rule-evaluation-service:8080']
        labels:
          application: 'Rule Evaluation Service Application'

  - job_name: 'vehicle-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['vehicle-service:8080']
        labels:
          application: 'Vehicle Service Application'

  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['api-gateway:8080']
        labels:
          application: 'API Gateway Application'

  - job_name: 'discovery-server'
    metrics_path: '/actuator/prometheus'
    basic_auth:
      username: eureka
      password: password
    static_configs:
      - targets: ['discovery-server:8761']
        labels:
          application: 'Discovery Server Application'