#Workflow
name: CI

#Event Triggers
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

#
jobs:
  build:
    #Setup Runner (throw away instance)
    runs-on: ubuntu-latest

    #
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java JDK Runtime
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile
        run: mvn -B -DskipTests test-compile

      - name: Test
        run: mvn -B verify
