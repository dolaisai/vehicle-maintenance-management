spring.application.name=rule-evaluation-service
server.port=0

##Eureka setup
eureka.client.serviceUrl.defaultZone=http://eureka:password@localhost:8761/eureka

##actuator config (NOTE Prometheus endpoint is included in the '*')
management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

##resilience4j properties
# (vehicle)
resilience4j.circuitbreaker.instances.vehicle.register-health-indicator=true
resilience4j.circuitbreaker.instances.vehicle.event-consumer-buffer-size=10
resilience4j.circuitbreaker.instances.vehicle.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.vehicle.sliding-window-size=10
resilience4j.circuitbreaker.instances.vehicle.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.vehicle.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.vehicle.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.vehicle.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.vehicle.minimum-number-of-calls=5

# (maintenance)
resilience4j.circuitbreaker.instances.maintenance.register-health-indicator=true
resilience4j.circuitbreaker.instances.maintenance.event-consumer-buffer-size=10
resilience4j.circuitbreaker.instances.maintenance.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.maintenance.sliding-window-size=10
resilience4j.circuitbreaker.instances.maintenance.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.maintenance.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.maintenance.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.maintenance.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.maintenance.minimum-number-of-calls=5

##resilience4j timeout properties
resilience4j.timelimiter.instances.vehicle.timeout-duration=3s
resilience4j.timelimiter.instances.maintenance.timeout-duration=3s

##resilience4j retry properties
resilience4j.retry.instances.vehicle.max-attempts=2
resilience4j.retry.instances.vehicle.wait-duration=500ms

resilience4j.retry.instances.maintenance.max-attempts=2
resilience4j.retry.instances.maintenance.wait-duration=500ms

resilience4j.retry.metrics.enabled=true
resilience4j.retry.event-consumer-buffer-size=50

##Sleuth config
spring.sleuth.sampler.probability=1.0

##zipkin config
spring.zipkin.base-url=http://localhost:9411

#kafka config
spring.kafka.bootstrap-servers=localhost:9092

#kafka PRODUCER config
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

#JSON type mapping for event objects
spring.kafka.producer.properties.spring.json.type.mapping=event:com.microservicesfinal.dto.requests.CreateAlertRequest

