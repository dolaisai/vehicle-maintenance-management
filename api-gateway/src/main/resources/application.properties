spring.application.name=api-gateway
server.port=8080

## Eureka setup
eureka.client.serviceUrl.defaultZone=http://eureka:password@localhost:8761/eureka

##logging setup
logging.level.root=INFO
logging.level.org.springframework.cloud.gateway.route.RouteDefinitionLocator = INFO
logging.level.org.springframework.cloud.gateway=TRACE

## Vehicle Service
spring.cloud.gateway.routes[0].id=vehicle-service
spring.cloud.gateway.routes[0].uri=lb://vehicle-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/vehicles/**,/api/users/**

## Maintenance Service
spring.cloud.gateway.routes[1].id=maintenance-service
spring.cloud.gateway.routes[1].uri=lb://maintenance-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/maintenance-intervals/**,/api/maintenance-histories/**

## Alert Service
spring.cloud.gateway.routes[2].id=alerts-service
spring.cloud.gateway.routes[2].uri=lb://alerts-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/alerts/**

## Rule Eval Service
spring.cloud.gateway.routes[3].id=rule-evaluation-service
spring.cloud.gateway.routes[3].uri=lb://rule-evaluation-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/rule-eval/**

## Discover Server Route
spring.cloud.gateway.routes[4].id=discovery-server
spring.cloud.gateway.routes[4].uri=http://localhost:8761
spring.cloud.gateway.routes[4].predicates[0]=Path=/eureka/web
spring.cloud.gateway.routes[4].filters[0]=SetPath=/

## Discover Server Static ResourcesRoute
spring.cloud.gateway.routes[5].id=discovery-server-static-resources
spring.cloud.gateway.routes[5].uri=http://localhost:8761
spring.cloud.gateway.routes[5].predicates[0]=Path=/eureka/**

##zipkin config
spring.zipkin.base-url=http://localhost:9411
spring.sleuth.sampler.probability=1.0

##prometheus config (add actuator/prometheus endpoint)
management.endpoints.web.exposure.include=prometheus
